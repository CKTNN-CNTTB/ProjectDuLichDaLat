<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ cá</title>
    <style>
        #hoca {
            /* Dùng rgba để tạo độ trong suốt cho nước, tránh làm mờ cả con cá bên trong */
            background-color: rgba(209, 240, 240, 0.5); 
            border: 2px solid #000;
            position: fixed; 
            height: 900px; 
            width: 90%; 
            bottom: 0; 
            right: 0; 
            left: 0; 
            margin: auto;
            overflow: hidden; /* Đảm bảo cá không bơi tràn ra ngoài viền hồ */
        }

        /* Đồng nhất dùng translate để cá bơi mượt hơn, không bị giật vị trí */
        @keyframes caboi {
            0% { translate: 0px 0px; rotate: 0deg; }
            25% { translate: 200px 0px; rotate: 0deg; }
            50% { translate: 400px 20px; rotate: -180deg; }
            75% { translate: 200px 0px; rotate: -180deg; }
            100% { translate: 0px 0px; rotate: 0deg; }
        }

        #camap {
            width: 120px; 
            position: absolute; /* Bắt buộc phải có để cá di chuyển được so với hồ */
            top: 100px; /* Vị trí bắt đầu thả cá từ trên xuống */
            left: 0;
            animation-name: caboi; 
            animation-duration: 20s; 
            animation-iteration-count: infinite;
        }
    </style>
</head>
<body>
    <!-- Thẻ div hồ cá bao bọc con cá -->
    <div id="hoca">
        <!-- Đặt id="camap" trực tiếp vào ảnh để nhận CSS chuyển động -->
        <img id="camap" src="images/aquarium/shark.png" alt="Cá mập">
    </div>
</body>
</html>
